# Conexión a PostgreSQL. Cada valor se puede sobreescribir con una variable de entorno
# (ej. AQUACONTROL_DB_PASSWORD) para no dejar la contraseña en el código.
# El host es un nombre específico (no localhost). Si la base está en esta misma PC,
# agrega ese nombre al archivo hosts (ver README).
db.host=aquacontrol.local
db.port=5432
db.name=purificadora
db.user=postgres
db.password=cambia_esta_contrasena
db.pool.max=10
