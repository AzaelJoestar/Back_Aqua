# Clave secreta para firmar los tokens JWT (mínimo 32 caracteres). CÁMBIALA.
# También se puede definir con la variable de entorno AQUACONTROL_JWT_SECRET.
jwt.secret=cambia-esta-clave-secreta-por-una-larga-y-aleatoria
jwt.horas=8

# ---- Ruta específica (no localhost) ----
# La API solo responde por este nombre de host (varios separados por coma).
# Si prueban con otro nombre o con la IP de la PC, cámbialo aquí o con AQUACONTROL_APP_HOST.
app.host=aquacontrol.local
host.estricto=true

# ---- Cifrado en tránsito (HTTPS) en venta, pago, usuarios y login ----
https.requerido=true
# true solo si hay un proxy de confianza delante de Tomcat que manda X-Forwarded-Proto
https.proxy.confiable=false

# Origen(es) del front permitidos por CORS, separados por coma (sin valor = ninguno).
cors.origen=http://aquacontrol.local:4200

# Nombre del rol (columna rol_nombre de roles_permisos) que puede administrar usuarios y roles.
rol.admin=admin
